services:
  - type: web
    name: hw2-regression-explorer
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn webapp.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: MKL_NUM_THREADS
        value: '1'
      - key: ALLOWED_ORIGINS
        value: https://maplenight0918.github.io
